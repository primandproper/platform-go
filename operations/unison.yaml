sqlc_version: 1.31.1
package: operationsdb
out: internal/operationsdb

# The keys of `schemas:` are the dialect roster, and this one has a single key.
# operations is Postgres-only because the work queue underneath it is — see the
# operations package comment — and a roster of one is first class here: it
# renders one corpus and gets the same checked guarantee, with the added freedom
# that a shape cannot diverge across a roster it is alone in.
#
# The schema file lives beside its source: rendered from operations/migrations by
# `go run ./internal/queriesgen -schema postgres`, at the empty table prefix —
# never edited by hand.
schemas:
  postgresql: migrations/schema/postgres.sql

queries:
  postgresql: internal/queries/postgres_generated.sql

options:
  # ddl.Qualify prefixes table names from consumer config at construction; the
  # generated SQL carries {{prefix}} markers substituted once by New.
  table_prefix_var: true

  type_overrides:
    # Postgres resolves no type for a COALESCE'd LIMIT, which is what the paged
    # listing binds its page size through. The sweep and the reap cast theirs in
    # the statement and are unaffected.
    - {column: "*.result_limit", go_type: int64}
    # Scope binds as the type, not a string derived from it, so an unset scope
    # is a driver error instead of a wider result set.
    - {column: "*.scope", go_type: github.com/primandproper/primitives-go/v2/tenancy.Scope}
