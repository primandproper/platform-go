sqlc_version: 1.31.1
package: operationssplitdb
out: internal/operationssplitdb

# The second of operations' two rosters, and the reason there are two. unison
# converges every query onto one shape across its roster and refuses a query
# whose shape differs, and operations' Postgres statements have shapes these two
# engines cannot take: a create, a claim and a flush that hand their row back
# through RETURNING, and guards bound as arrays. So MySQL and SQLite render
# their own statement set — each of those writes a guarded statement whose row
# count is read first and whose row is read back on the same transaction — and
# it is generated here, while unison.yaml keeps Postgres's in
# operations/internal/operationsdb. See operations/internal/queries' renderSplit.
#
# The schema files live beside their source: rendered from operations/migrations
# by `go run ./internal/queriesgen -schema <dialect>`, at the empty table prefix
# — never edited by hand.
schemas:
  mysql: migrations/schema/mysql.sql
  sqlite: migrations/schema/sqlite.sql

queries:
  mysql: internal/queries/mysql_generated.sql
  sqlite: internal/queries/sqlite_generated.sql

options:
  # ddl.Qualify prefixes table names from consumer config at construction; the
  # generated SQL carries {{prefix}} markers substituted once by New.
  table_prefix_var: true

  # MySQL accepts only a bare placeholder in LIMIT and names it `limit`; SQLite
  # spells the argument out. The name converges here.
  rename_params:
    mysql:
      limit: result_limit

  type_overrides:
    # Scope binds as the type, not a string derived from it, so an unset scope
    # is a driver error instead of a wider result set.
    - {column: "*.scope", go_type: github.com/primandproper/primitives-go/v2/tenancy.Scope}
    # id and kind are binary strings on MySQL, so that they compare byte for
    # byte as they do everywhere else, and a binary string is []byte to the
    # analyzer. What crosses the seam is still the text the store was handed.
    - {column: "*.id", go_type: string}
    - {column: "*.ids", go_type: string}
    - {column: "*.kind", go_type: string}
    # The listing's keyset cursor, which is an id and so is typed from the
    # binary column it is compared against. It is optional: an absent cursor is
    # the first page.
    - {column: "*.page_cursor", go_type: "*string"}
    # The listing's kind narrowing, which MySQL types as a type of its own in
    # the arm that compares it against NULL. The pointer is load-bearing: an
    # absent argument narrows nothing.
    - {column: "*.kind_filter", go_type: "*string"}
    # The integer columns, whose width the engines do not agree on: MySQL
    # resolves INT to a 32-bit Go type and SQLite INTEGER to a 64-bit one. The
    # widths are the Postgres roster's, so a row converts between the two.
    - {column: "*.units_total", go_type: "*int64"}
    - {column: "*.units_done", go_type: int64}
    - {column: "*.attempts", go_type: int64}
    - {column: "*.progress_count", go_type: int64}
    - {column: "*.revision", go_type: int64}
    # Arguments neither engine can type, because each is only ever an operand:
    # a microsecond count added to the clock, a bound on a read.
    - {column: "*.result_limit", go_type: int64}
    - {column: "*.lease_microseconds", go_type: int64}
    - {column: "*.grace_microseconds", go_type: int64}
    - {column: "*.retention_microseconds", go_type: int64}
