sqlc_version: 1.31.1
package: timersdb
out: internal/timersdb

# The keys of `schemas:` are the dialect roster, and this one has a single key.
# Postgres is the one dialect whose claim is a single statement handing its rows
# back through RETURNING and whose batches bind as arrays, and unison converges a
# query onto one shape across its roster — so MySQL and SQLite, whose statements
# have other shapes, are a roster of their own in unison.split.yaml. See the
# timers package comment.
#
# The schema file lives beside its source: rendered from timers/migrations by
# `go run ./internal/queriesgen -schema postgres`, at the empty table prefix —
# never edited by hand.
schemas:
  postgresql: migrations/schema/postgres.sql

queries:
  postgresql: internal/queries/postgres_generated.sql

options:
  # ddl.Qualify prefixes table names from consumer config at construction; the
  # generated SQL carries {{prefix}} markers substituted once by New.
  table_prefix_var: true
