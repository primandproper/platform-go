sqlc_version: 1.31.1
package: webhooksdb
out: internal/webhooksdb

# The keys of `schemas:` are the dialect roster. The schema files live beside
# their source: rendered from webhooks/migrations by
# `go run ./internal/queriesgen -schema <dialect>`, at the empty table prefix —
# never edited by hand.
schemas:
  postgresql: migrations/schema/postgres.sql
  mysql: migrations/schema/mysql.sql
  sqlite: migrations/schema/sqlite.sql

queries:
  postgresql: internal/queries/postgres_generated.sql
  mysql: internal/queries/mysql_generated.sql
  sqlite: internal/queries/sqlite_generated.sql

options:
  # ddl.Qualify prefixes table names from consumer config at construction; the
  # generated SQL carries {{prefix}} markers substituted once by New.
  table_prefix_var: true

  # MySQL accepts only a bare placeholder in LIMIT and names it `limit`;
  # Postgres rejects `limit` as an argument name. The name converges here.
  rename_params:
    mysql:
      limit: result_limit

  type_overrides:
    # Both engines resolve no type for these: SQLite for most arguments,
    # Postgres for a COALESCE'd LIMIT.
    - {column: "*.result_limit", go_type: int64}
    - {column: "*.include_archived", go_type: bool}
    # is a driver error instead of a wider result set. The claimed-dispatch
    # projection carries a second one under an alias — the delivery's scope and
    # the endpoint's are the same kind of answer about two rows — and it takes
    # the same type for the same reason.
    - {column: "*.scope", go_type: github.com/primandproper/primitives-go/tenancy.Scope}
    - {column: "*.endpoint_scope", go_type: github.com/primandproper/primitives-go/tenancy.Scope}
    # The integer columns, whose width the three engines do not agree on:
    # Postgres and MySQL resolve INTEGER to a 32-bit Go type and SQLite to a
    # 64-bit one, which is a divergence unison refuses rather than reconciles.
    # Named here, all three emit the same signature and the store converts once
    # at its own boundary.
    - {column: "*.attempts", go_type: int64}
    - {column: "*.attempt_count", go_type: int64}
    - {column: "*.status_code", go_type: int64}
    - {column: "*.duration_ms", go_type: int64}
    - {column: "*.depth", go_type: int64}
