---
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.go'
      - '**/*.sql'
      - '**/*.proto'
      # README.md carries generated sections — the store/transport roster and
      # the dialect matrix, both emitted by internal/cmd/readmegen. A package
      # move is a .go change and trips this job anyway; a hand edit to one of
      # those sections would not, and this is what catches it.
      - README.md
      - .protoc-version
      - go.mod
      - go.sum

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: generated files
jobs:
  golang:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Regenerate
        run: make generate format

      - name: Verify no drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "go generate produced a diff. Run 'make generate' locally and commit the result."
            echo "A _generated.sql under a package's internal/queries is generated too — edit the column list, not the SQL."
            git status --short
            git diff
            exit 1
          fi

  proto:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      # All three parts of the toolchain are pinned — protoc by .protoc-version,
      # protoc-gen-go and protoc-gen-go-grpc by go.mod's tool directive — because
      # each generator stamps its own version and protoc's into every file it
      # writes. Unpinned, this job would report which runner image it drew
      # rather than whether the tree is current.
      - name: Regenerate
        run: make proto format

      - name: Verify no drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "make proto produced a diff. Run 'make proto format' locally and commit the result."
            git status --short
            git diff
            exit 1
          fi

  unison:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      # Both halves of the toolchain are pinned — sqlc by .sqlc-version, unison
      # by .unison-version — enforced by unison_generate.sh installing exactly
      # what the pins name. sqlc-gen-unison is an org-private module, so resolving
      # it needs credentials the default workflow token does not carry:
      # UNISON_MODULE_TOKEN is an org token with read access to that repo.
      - name: Regenerate
        env:
          GOPRIVATE: github.com/primandproper/*
        run: |
          git config --global url."https://x-access-token:${{ secrets.UNISON_MODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          make unison format

      - name: Verify no drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "make unison produced a diff. Run 'make unison format' locally and commit the result."
            echo "The schema files under migrations/schema and every internal/<pkg>db package are generated — edit the migrations or the column lists, not these."
            git status --short
            git diff
            exit 1
          fi
