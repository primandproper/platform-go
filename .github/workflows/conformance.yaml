---
# The conformance suites, run on their own.
#
# They are separated from the coverage gate rather than excluded from CI. What
# they assert is this module's promises against an assembled server, which is a
# different question from "do the units work" and deserves its own answer on a
# pull request: a red here means a promise moved, and reading that out of a job
# named "coverage gate" is how it gets mistaken for a flake.
#
# The coverage gate no longer runs them because `go test` credits their coverage
# to whichever harness executed them — codecov.yml and .scripts/coverage.sh both
# carry the reasoning. Excluding them from a number is not excluding them from
# CI, and this file is what makes that true.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: conformance
jobs:
  conformance:
    timeout-minutes: 20
    strategy:
      matrix:
        go-version: ['1.27.x']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      # No containers yet, and that is a statement about what exists rather
      # than a choice: every subject these suites run against today is a
      # hand-built server on a bufconn over SQLite. The assembled subject —
      # service.New over Postgres and MariaDB — is what flips this to "true",
      # and it should flip in the change that adds it.
      - name: run conformance suites
        env:
          RUN_CONTAINER_TESTS: "false"
        run: CGO_ENABLED=1 go test -shuffle=on -race -vet=all ./conformance/...
