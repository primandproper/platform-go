sqlc_version: 1.31.1
package: meteringdb
out: internal/meteringdb

# The keys of `schemas:` are the dialect roster. The schema files live beside
# their source: rendered from metering/migrations by
# `go run ./internal/queriesgen -schema <dialect>`, at the empty table prefix —
# never edited by hand.
schemas:
  postgresql: migrations/schema/postgres.sql
  mysql: migrations/schema/mysql.sql
  sqlite: migrations/schema/sqlite.sql

queries:
  postgresql: internal/queries/postgres_generated.sql
  mysql: internal/queries/mysql_generated.sql
  sqlite: internal/queries/sqlite_generated.sql

options:
  # ddl.Qualify prefixes the table names from consumer config at construction;
  # the generated SQL carries {{prefix}} markers substituted once by New.
  table_prefix_var: true

  # MySQL accepts only a bare placeholder in LIMIT and names it `limit`;
  # Postgres rejects `limit` as an argument name. The name converges here.
  rename_params:
    mysql:
      limit: result_limit

  type_overrides:
    # The page size, which SQLite resolves no type for at all and Postgres
    # resolves none for through the claim read's COALESCE.
    - {column: "*.result_limit", go_type: int64}
    # Scope binds as the type, not a string derived from it, so an unset scope
    # is a driver error instead of a row filed under the global one.
    - {column: "*.scope", go_type: github.com/primandproper/primitives-go/v2/tenancy.Scope}
