# Generated moq mocks are excluded from coverage. Every <pkg>/mock directory
# holds exactly two things — the file moq generates and a doc.go carrying the
# go:generate directive — so nothing hand-written is hidden by this.
#
# They are excluded because their coverage number is noise in both directions.
# A mock method is "covered" only when some test happens to call that method and
# its Calls accessor, so the figure measures which mocks tests reach rather than
# whether anything is tested. Left in, a package that adds a mock for a wide
# interface reports a coverage drop for having made itself easier to test, which
# is precisely the wrong incentive.
#
# Generated protobuf bindings are excluded for the same reason. A .pb.go is
# protoc-gen-go's output verbatim — getters, Reset, String, and a descriptor
# table — and a test written to raise its number would be a test of protobuf
# rather than of anything here. What is worth testing about the schema is
# whether it still describes the Go types, and filtering/grpc's conformance
# test does that.
#
# The sqlc-gen-unison output is the third generated case and the largest. Every
# file in every <pkg>/internal/<pkg>db directory carries "Code generated by
# github.com/primandproper/sqlc-gen-unison. DO NOT EDIT." — there is no
# hand-written file in any of them — and what they contain is one method per
# statement per dialect, which is why they are also the biggest single block of
# code in the module. Whether those statements are right is settled before a
# test could run: `sqlc compile` checks each one against the schema the
# migrations render, and the store that calls them is tested against all three
# dialects. A test written against the generated method instead would assert
# that unison emitted what unison emitted.
#
# The queriesgen commands are generated code's other half. Each is a main
# package that writes its package's canonical sqlc input at `make generate`
# time; nothing imports one and nothing executes one outside that target, so
# there is no caller for a test to stand in for.
#
# The conformance suites are excluded for a different reason: they are test
# code, and the figure is an artifact of how `go test` attributes coverage
# rather than a claim about them. oauth2servertest, distributedlocktest and
# webauthntest each hold the behavior every implementation of one interface
# owes its callers, and each is run against three to five of them — but only
# ever from another package's test binary, and coverage is credited to the
# package under test. So the suites this module leans on hardest are the ones
# it reports as wholly untested, and the way to raise their number would be to
# write a test of a test.
#
# `conformance/` is this module's own instance of that, and the first one it
# has had — the three suites named above are primitives-go's and no directory
# here matches them, so until now this paragraph described a rule with nothing
# to apply it to. The numbers say the rest: conformance/anonymous reports 0.9%
# while running an assertion against all thirty-one of identity's RPCs on every
# CI run, because the binary that runs it is conformance/identity's and
# coverage.sh passes no -coverpkg. conformance and conformance/all report 0.0%
# for the same reason.
#
# The two leaf suites that hold their own harness — conformance/audit and
# conformance/identity — report 98.2% and 100%, which is the same accident
# pointing the other way rather than evidence that those two are better tested.
# Excluding the tree keeps one honest number instead of two misleading ones.
ignore:
  - "**/mock/**"
  - "**/*.pb.go"
  - "**/internal/*db/**"
  - "**/internal/queriesgen/**"
  - "**/oauth2servertest/**"
  - "**/distributedlocktest/**"
  - "**/webauthntest/**"
  - "conformance/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        if_ci_failed: error
    patch:
      default:
        informational: true
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
