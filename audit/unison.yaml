sqlc_version: 1.31.1
package: auditdb
out: internal/auditdb

# The keys of `schemas:` are the dialect roster. The schema files live beside
# their source: rendered from audit/migrations by
# `go run ./internal/queriesgen -schema <dialect>`, at the empty table prefix —
# never edited by hand.
schemas:
  postgresql: migrations/schema/postgres.sql
  mysql: migrations/schema/mysql.sql
  sqlite: migrations/schema/sqlite.sql

queries:
  postgresql: internal/queries/postgres_generated.sql
  mysql: internal/queries/mysql_generated.sql
  sqlite: internal/queries/sqlite_generated.sql

options:
  # ddl.Qualify prefixes table names from consumer config at construction; the
  # generated SQL carries {{prefix}} markers substituted once by New.
  table_prefix_var: true

  # MySQL accepts only a bare placeholder in LIMIT and names it `limit`;
  # Postgres rejects `limit` as an argument name. The name converges here.
  rename_params:
    mysql:
      limit: result_limit

  type_overrides:
    # Both engines resolve no type for these: SQLite for most arguments,
    # Postgres for a COALESCE'd LIMIT.
    - {column: "*.result_limit", go_type: int64}
    # Scope binds as the type, not a string derived from it, so an unset scope
    # is a driver error instead of a wider result set. The filter beside it is
    # deliberately not this type: see the scope_filter entry below.
    - {column: "*.scope", go_type: github.com/primandproper/primitives-go/tenancy.Scope}
    # The chain's positions and the entry's, which the three engines otherwise
    # disagree about the width of.
    - {column: "*.seq", go_type: int64}
    - {column: "*.head_seq", go_type: int64}
    - {column: "*.pruned_through_seq", go_type: int64}
    - {column: "*.boundary", go_type: int64}
    - {column: "*.through_seq", go_type: int64}
    # The two aggregates the prune bounds project. Each is NULL for a scope
    # holding nothing that answers it — a scope with no entries at all, or one
    # whose entries are all past the horizon — and that is the reading the
    # sweep acts on rather than a value it substitutes for.
    - {column: "*.oldest_seq", go_type: "*int64"}
    - {column: "*.first_kept_seq", go_type: "*int64"}
    # The paged list's six selectors. Each is compared against its column in one
    # arm of its predicate and against NULL in the other, and that second arm is
    # a cast MySQL resolves to a string type of its own — so the three engines
    # converge on nothing without being told. They are pointers because an
    # absent one narrows nothing, which is the whole reading the shape carries.
    - {column: "*.scope_filter", go_type: "*string"}
    - {column: "*.actor_id_filter", go_type: "*string"}
    - {column: "*.actor_type_filter", go_type: "*string"}
    - {column: "*.resource_id_filter", go_type: "*string"}
    - {column: "*.resource_type_filter", go_type: "*string"}
    - {column: "*.event_type_filter", go_type: "*string"}
