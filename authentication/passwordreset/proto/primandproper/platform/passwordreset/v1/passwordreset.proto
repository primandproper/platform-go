// Package primandproper.platform.passwordreset.v1 is the wire schema for the
// one flow a person who cannot sign in still needs: proving they own the
// address an account was registered with, and choosing a new password with that
// proof.
//
// This file is shipped inside the published Go module, and it is the file itself
// that is shipped -- not a copy for you to keep in sync. A consumer puts the
// module's proto directories on protoc's path and imports this file by its
// canonical name, exactly as signin.proto and filtering.proto already work:
//
//	PLATFORM_PROTO := $(shell go list -m -f '{{.Dir}}' github.com/primandproper/platform-go/v14)
//
//	protoc --proto_path proto/ \
//	    --proto_path $(PLATFORM_PROTO)/authentication/passwordreset/proto \
//	    --go_opt=Mprimandproper/platform/passwordreset/v1/passwordreset.proto=github.com/primandproper/platform-go/v14/authentication/passwordreset/passwordresetpb \
//	    $(CONSUMER_PROTO_FILES)   # the platform file deliberately absent from that list
//
// Field numbers are the compatibility promise, across every language a consumer
// generates into. Numbers are never reused and never repurposed: a field that
// goes away is reserved.
//
// # Why it is its own file rather than three RPCs on signin.proto
//
// signin.proto says it, of this flow by name: passkeys, password reset and
// session management are each "a flow of its own over an engine this module
// already ships, and each is its own file rather than a branch in this one".
// The reason shows in the authority. Every request here carries a mailed secret
// or an address and nothing else -- there is no caller, and there cannot be one,
// because the whole premise is somebody who cannot sign in. Sign-in's schema has
// six RPCs that need a principal, and a file where two thirds of the messages
// answer to one and none of these do would be a file whose rules have to be
// restated per message.
//
// # The three refusals, and why they are told apart
//
// A link that cannot be spent is expired, already used, or was never a link, and
// this schema keeps them distinct where almost everything else in this module
// collapses such a set. The argument is the store's and it does not stop at the
// transport: the secret is high-entropy, so learning which of the three happened
// requires already holding the token. Telling somebody with a day-old link that
// it expired is worth more than the nothing an attacker learns from it.
//
// The one place that argument does not reach is [RequestPasswordResetRequest],
// which carries an address rather than a secret. There the answer is identical
// whoever holds it, and the response is empty so that it can stay that way.
//
// # What is not here, and why
//
// No scope field, anywhere, and the name is reserved so there cannot be one.
// identity.proto and signin.proto give the reason at greater length: a scope a
// client could name is a cross-tenant read hiding behind a request field. It
// matters here for signin.proto's reason exactly -- nobody on these requests has
// been authenticated, so the directory a reset is made against comes off the
// connection rather than off anything a client sends.
//
// No hashed password in either direction, and the plaintext travels once, in
// [CompletePasswordResetRequest]. It is what makes this service's transport
// security a requirement rather than a recommendation.
//
// No token in any response. The secret this flow mints travels to the person it
// is about, in mail the consumer sends; it arrives back here as a request field
// on the two RPCs that answer a link, which is the one direction a token travels
// on any schema in this module.
//
// No user, anywhere. A reset names an address on the way in and nothing on the
// way out, and [VerifyPasswordResetTokenResponse] deliberately does not say whom
// the link is for -- see that message.
//
// No token minted at the end. Completing a reset does not sign anybody in: the
// door for that is signin.proto's, with the password that was just chosen. And
// completing a reset does not end the sessions the account already has, which is
// the same behaviour signin's UpdatePassword has and is the consumer's to change
// -- signin.Service.RevokeRefreshTokensForSubject is the call, in whatever
// answers this one.

syntax = "proto3";

package primandproper.platform.passwordreset.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/primandproper/platform-go/v14/authentication/passwordreset/passwordresetpb;passwordresetpb";

// RequestPasswordResetRequest asks for a link that lets whoever holds an address
// choose a new password.
//
// There is no field naming a user. The address is the whole of what this names,
// and who it belongs to is read off the directory rather than supplied by the
// caller -- which is RequestMagicLinkRequest's rule, for the same reason.
message RequestPasswordResetRequest {
  reserved "scope";

  // email_address is who to mail. An address nobody holds is answered exactly as
  // one somebody holds.
  string email_address = 1;
}

// RequestPasswordResetResponse is empty, and its emptiness is load-bearing
// rather than incidental.
//
// It carries no token, no "we sent it" flag, and no field that could differ
// between an address somebody holds and one nobody does. The service answers
// identically for both and holds its own answer to a floor so the two cannot be
// told apart by a stopwatch either; a response that said more would rebuild the
// account enumerator that floor exists to prevent.
//
// A consumer's own handler owes the same silence. Answering a known address with
// a 200 and an unknown one with a 404 puts the oracle back in their transport,
// where nothing in this module can reach it.
message RequestPasswordResetResponse {}

// VerifyPasswordResetTokenRequest asks whether a link can still be spent, which
// is the page load that precedes the form.
//
// It exists so that a person who followed a dead link is told before they type a
// password rather than after. Nothing is held open by it: a token live when this
// answered can be spent by somebody else a moment later, and the answer that
// decides anything is CompletePasswordReset's.
message VerifyPasswordResetTokenRequest {
  reserved "scope";

  // token is the secret the link carried.
  string token = 1;
}

// VerifyPasswordResetTokenResponse says a link is live, and says nothing about
// whom it belongs to.
//
// The user is deliberately absent. A client has nothing it could do with an
// identifier it cannot read anything with -- every directory read needs a caller
// and this request has none -- and an address would tell whoever is holding a
// forwarded or intercepted link which account it opens. What the holder needs is
// whether to render the form, which is this message's presence, and how long
// they have, which is the one field.
message VerifyPasswordResetTokenResponse {
  // expires_at is the deadline past which this link is refused. It is here for a
  // client rendering "this link expires in twenty minutes", and it discloses
  // nothing: it is a fact about a secret the caller is already holding.
  google.protobuf.Timestamp expires_at = 1;
}

// CompletePasswordResetRequest spends a link and sets the password it was issued
// for.
//
// There is no field naming a user, for RequestPasswordResetRequest's reason and
// AttachPasswordRequest's: who this is about is read off the row the token
// named, which is what keeps an anonymous RPC from being a way to name somebody
// else.
//
// The redemption, the password write and the withdrawal of every other reset
// link that person was holding are one transaction. No two of the three can land
// without the third, which is the half a hand-written version gets wrong: a
// failed revocation logged and reported as success leaves live reset links for
// an account whose password has just changed.
message CompletePasswordResetRequest {
  reserved "scope";

  // token is the secret the link carried, and is the whole of this request's
  // authority.
  string token = 1;

  // new_password is the password they chose. Whether it is long enough, unusual
  // enough or unlike the last four is the consumer's rule, applied in front of
  // this call -- this service holds no password policy, for the reason sign-in
  // holds none. The one rule it does apply is that it is not empty, which is not
  // a policy but a write that would lock the user out, and it is applied before
  // the token is spent so somebody who submitted an empty form still holds their
  // link.
  string new_password = 2;
}

// CompletePasswordResetResponse is empty and is a message rather than
// google.protobuf.Empty so that it can gain a field without becoming a breaking
// change.
//
// It carries no token in either sense: not the link, which has just been spent,
// and not an access token, because completing a reset does not sign anybody in.
// The next call is a sign-in with the password that was just chosen.
message CompletePasswordResetResponse {}

// PasswordResetService is the way back in for somebody who cannot sign in.
//
// All three of its RPCs are anonymous by definition, and that is the whole shape
// of the service: a caller who could prove who they are would be changing their
// password through sign-in instead. None of them requires a permission -- there
// is no grant that would make "I forgot my password" safer, and an anonymous
// caller holds no roles for one to check.
//
// What a consumer owes in front of it is a rate limit, and it is not optional:
// RequestPasswordReset sends mail on request, and it is the one RPC here that
// does anything on behalf of somebody who has proven nothing at all.
service PasswordResetService {
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc VerifyPasswordResetToken(VerifyPasswordResetTokenRequest) returns (VerifyPasswordResetTokenResponse);
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (CompletePasswordResetResponse);
}
